name: Flutter CI

on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      update_goldens:
        description: 'Regenerate golden images and upload them as an artifact'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Golden hanya cocok bila dibuat di runner yang sama dengan yang mengujinya,
  # dan tidak ada Flutter SDK di mesin pengembang — jadi regenerasinya dijalankan
  # di sini, manual, lalu PNG-nya diunduh dan di-commit.
  update-goldens:
    if: inputs.update_goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Regenerate goldens
        run: flutter test --update-goldens test/profil_tab_golden_test.dart

      - uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: test/goldens/

  analyze-build:
    if: ${{ !inputs.update_goldens }}
    runs-on: ubuntu-latest
    # Di level job, bukan step: konteks `secrets` tidak tersedia di `if:` step,
    # dan step-level env belum terlihat oleh `if:` step itu sendiri.
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Analyze lebih dulu: selama 5 test lama masih merah, menaruh Test di
      # depan membuat Analyze tidak pernah jalan sama sekali.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Tanpa langkah ini, build.gradle.kts jatuh ke signing config debug dan
      # runner GitHub memakai debug.keystore yang dibuat ulang tiap kali — SHA-1
      # APK berubah-ubah dan tidak akan pernah cocok dengan OAuth client mana
      # pun, sehingga Google Sign-In selalu DEVELOPER_ERROR (10). Kalau secret
      # belum diisi, langkah ini dilewati dan build tetap jalan seperti semula.
      - name: Prepare release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          umask 077
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build release APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64

      # Dicetak supaya SHA-1 yang harus didaftarkan di Google Cloud bisa dibaca
      # dari log, tanpa perlu memasang APK-nya dulu.
      - name: Report APK signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk \
            | grep -E "certificate DN|SHA-1"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Latest Build
          tag_name: latest
          prerelease: true
          make_latest: false
