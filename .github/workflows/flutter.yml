name: Flutter CI

on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      update_goldens:
        description: 'Regenerate golden images and upload them as an artifact'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Golden hanya cocok bila dibuat di runner yang sama dengan yang mengujinya,
  # dan tidak ada Flutter SDK di mesin pengembang — jadi regenerasinya dijalankan
  # di sini, manual, lalu PNG-nya diunduh dan di-commit.
  update-goldens:
    if: inputs.update_goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Regenerate goldens
        run: flutter test --update-goldens test/profil_tab_golden_test.dart

      - uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: test/goldens/

  analyze-build:
    if: ${{ !inputs.update_goldens }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Analyze lebih dulu: selama 5 test lama masih merah, menaruh Test di
      # depan membuat Analyze tidak pernah jalan sama sekali.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Latest Build
          tag_name: latest
          prerelease: true
          make_latest: false
